<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/b77d45241e.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="styles/index.css" >
    <script src="src/index.js" defer></script>
    <title>Weather</title>
</head>
<body>
    <header>
        <div style="position:relative;" class="input-container">
            <input placeholder="Search" id="search">
            <button id="btnSearch"><i class="fa-solid fa-magnifying-glass"></i></button>
            <div class="location-autofill" style="position: absolute;">
                <span>loacation1 fdasf sfdasf safda sfda</span>
                <span>loacation1</span>
                <span>loacation1</span>
            </div>
        </div>
    </header>

    <content>
        <div><img src="//cdn.weatherapi.com/weather/64x64/night/116.png" id="weatherIcon"></div>
        <h1 id="current-temp">22 C</h1>
        <h2 id="weather-location">London</h2>
        <div class="other-weather-details">
            <span id="wind-speed"><i class="fa-solid fa-wind"></i> 12 km/h</span>
            <span id="humidity"><i class="fa-solid fa-droplet"></i> 12%</span>
        </div>
    </content>

    <footer>
        Powered by <a href="https://www.weatherapi.com/" title="Weather API">WeatherAPI.com</a>
    </footer>
</body>
</html>
